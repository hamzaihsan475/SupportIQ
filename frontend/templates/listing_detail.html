{% extends "base.html" %}

{% block title %}Listing | SupportIQ{% endblock %}

{% block content %}
<div class="container detail-shell">
    <a href="/listings" class="detail-back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; vertical-align: middle;"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Back to Listings
    </a>

    <div id="detail-content">
        <!-- Initial loading state. JS replaces this on fetch complete. -->
        <div class="detail-loading">Loading listing...</div>
    </div>
</div>

<style>
    .detail-shell {
        padding-top: 2rem;
        padding-bottom: 4rem;
    }
    .detail-back-link {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: var(--color-text-muted);
        font-size: var(--fs-small);
        font-weight: 600;
        margin-bottom: 2rem;
        transition: color 0.15s ease;
    }
    .detail-back-link:hover {
        color: var(--color-primary);
    }
    .detail-loading {
        text-align: center;
        padding: 4rem 0;
        font-family: var(--font-headings);
        font-size: 1.5rem;
        color: var(--color-text-muted);
    }
</style>
<link rel="stylesheet" href="/static/css/listing_detail.css">

<script>
    // Embed the listing id into the page so the JS doesn't have to scrape it
    // from the URL. This is the only piece of state the server contributes.
    window.__LISTING_ID__ = {{ listing_id | tojson }};
</script>
<script src="{{ url_for('static', path='/js/listing_detail.js') }}"></script>
{% endblock %}
